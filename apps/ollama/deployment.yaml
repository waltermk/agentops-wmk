apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-ai
      initContainers:
        - name: pull-hermes
          image: ollama/ollama:latest
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache curl
              ollama serve &
              SERVER_PID=$!
              until curl -s http://localhost:11434/api/version > /dev/null; do sleep 1; done
              ollama pull hermes3:8b
              kill $SERVER_PID
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              memory: "8Gi"
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-models-pvc