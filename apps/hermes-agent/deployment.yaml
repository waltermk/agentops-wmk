apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: ai-agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-dev  # <--- Running on dev node now
      containers:
        - name: agent
          image: nousresearch/hermes-agent:v2026.8.3
          command: ["gateway", "run"]
          ports:
            - containerPort: 8642
              name: gateway
          env:
            - name: PORT
              value: "8642"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"          # <--- Allows cross-node cluster access
            - name: HERMES_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-gateway-secret
                  key: token
            - name: OLLAMA_BASE_URL
              value: "http://ollama-service.ai-agents.svc.cluster.local:11434" # <--- Automatically crosses nodes via k3s internal routing
            - name: MODEL_NAME
              value: "hermes3:8b"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-ai-keys
                  key: gemini
                  optional: true
          volumeMounts:
            - name: agent-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: hermes-agent-pvc