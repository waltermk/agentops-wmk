apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: ai-agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-dev
      initContainers:
        - name: setup-auth
          image: nousresearch/hermes-agent:v2026.8.3
          command: ["/opt/hermes/.venv/bin/python3"]
          args:
            - "-c"
            - |
              import os
              import yaml
              from plugins.dashboard_auth.basic import hash_password
              
              config_path = '/opt/data/config.yaml'
              config = {}
              
              if os.path.exists(config_path):
                  with open(config_path, 'r') as f:
                      config = yaml.safe_load(f) or {}
              
              # Force API Server to bind to all interfaces
              if 'api_server' not in config:
                  config['api_server'] = {}
              config['api_server']['enabled'] = True
              config['api_server']['host'] = '0.0.0.0'
              config['api_server']['port'] = 8642
              
              # Force Dashboard to bind to all interfaces
              if 'dashboard' not in config:
                  config['dashboard'] = {}
              config['dashboard']['host'] = '0.0.0.0'
              config['dashboard']['port'] = 8642
              config['dashboard']['basic_auth'] = {
                  'username': 'admin',
                  'password_hash': hash_password('admin123')
              }
              
              with open(config_path, 'w') as f:
                  yaml.dump(config, f)
          volumeMounts:
            - name: agent-data
              mountPath: /opt/data
      containers:
        - name: agent
          image: nousresearch/hermes-agent:v2026.8.3
          args: ["gateway", "run"]
          ports:
            - containerPort: 8642
              name: gateway
          env:
            - name: PORT
              value: "8642"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-gateway-secret
                  key: token
            - name: HERMES_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-gateway-secret
                  key: token
            - name: OLLAMA_BASE_URL
              value: "http://ollama-service.ai-agents.svc.cluster.local:11434"
            - name: MODEL_NAME
              value: "hermes3:8b"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-ai-keys
                  key: gemini
                  optional: true
          volumeMounts:
            - name: agent-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: hermes-agent-pvc